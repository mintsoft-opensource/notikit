# Notikit — self-host 번들 (Small 프로파일: 한 박스 전부).
# 프로덕션은 DATABASE_URL / REDIS_URL 을 관리형으로 지정하고 postgres/redis 서비스 제거.
services:
  # DB 마이그레이션 1회 실행(멱등) — full deps 가 있는 build 스테이지에서 실행해
  # standalone 트레이싱 누락 위험을 제거. web 은 이 서비스 성공 후 시작.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: build
    command: ["node", "apps/web/migrate.mjs"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://notikit:notikit@postgres:5432/notikit
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://notikit:notikit@postgres:5432/notikit
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: ["node", "apps/web/worker.mjs"]
    env_file: .env
    environment:
      WORKER_BASE_URL: http://web:3000
      # ADMIN_TOKEN 은 .env 에서 주입 (web 과 동일해야 함)
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notikit
      POSTGRES_PASSWORD: notikit
      POSTGRES_DB: notikit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notikit"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

volumes:
  pgdata:
  redisdata:
