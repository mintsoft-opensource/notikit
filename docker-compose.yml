# Notikit — self-host 번들 (Small 프로파일: 한 박스 전부).
# 프로덕션은 DATABASE_URL / REDIS_URL 을 관리형으로 지정하고 postgres/redis 서비스 제거.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://notikit:notikit@postgres:5432/notikit
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: ["node", "worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://notikit:notikit@postgres:5432/notikit
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notikit
      POSTGRES_PASSWORD: notikit
      POSTGRES_DB: notikit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notikit"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

volumes:
  pgdata:
  redisdata:
