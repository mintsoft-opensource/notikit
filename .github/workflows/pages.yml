# 소개 사이트(notikit.mint-soft.com) — site/ 나 가이드 문서(apps/web/docs)가 바뀌면 GitHub Pages 로 올린다.
# 문서는 콘솔 가이드와 같은 마크다운을 site/build-docs.mjs 가 /docs/*.html 로 만든다.
# 커스텀 도메인은 저장소 Pages 설정에 있다(Actions 배포는 CNAME 파일을 읽지 않는다).
name: pages

on:
  push:
    branches: [master]
    paths: ["site/**", "apps/web/docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 워크스페이스 전체를 설치하지 않는다 — 문서 변환에 필요한 건 marked 하나다(콘솔과 같은 메이저)
      - name: 문서 빌드
        run: |
          npm install --prefix "$RUNNER_TEMP/marked" --no-save --no-audit --no-fund marked@18
          node site/build-docs.mjs "$RUNNER_TEMP/marked" _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
