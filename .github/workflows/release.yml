# 릴리스 — 태그를 밀면 이미지가 만들어지고 서명되고 배포처에 등록된다.
#
# 사람이 손으로 하는 단계를 남기지 않는 것이 목적이다. 특히 `hasMigrations` 는
# 저널 비교로 정한다 — 손으로 적으면 언젠가 틀리고, 틀리는 날은 고객 스키마가
# 백업 없이 바뀌는 날이다.
name: release

on:
  push:
    tags: ["v*"]

# 레지스트리를 따로 정하지 않으면 GHCR(ghcr.io/<조직>)에 올린다 — 계정도 비밀값도 필요 없다.
# 조직 이름이 바뀌어도 repository_owner 를 따라가므로 워크플로를 고칠 일이 없다.
env:
  REGISTRY: ${{ vars.REGISTRY_SERVER || 'ghcr.io' }}
  IMAGE: ${{ vars.REGISTRY_SERVER || format('ghcr.io/{0}', github.repository_owner) }}/notikit
  UPDATER_IMAGE: ${{ vars.REGISTRY_SERVER || format('ghcr.io/{0}', github.repository_owner) }}/notikit-updater

jobs:
  # 깨진 코드가 서명된 이미지로 고객에게 가지 않도록, 배포 전에 전부 돌린다.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notikit
          POSTGRES_PASSWORD: notikit
          POSTGRES_DB: notikit_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notikit -d notikit_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgres://notikit:notikit@localhost:5432/notikit_e2e
      ADMIN_TOKEN: e2e-admin-token
      NOTIKIT_ENCRYPTION_KEY: e2e-encryption-key-32bytes-minimum
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: web 타입 검사
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: web 단위 테스트
        working-directory: apps/web
        run: pnpm exec vitest run

      # 빌드 없는 .mjs(워커·업데이터·업데이트 서버·릴리스 도구)는 vitest 범위 밖이라 node 내장 러너로 돈다
      - name: 운영 스크립트 테스트
        run: >-
          node --test apps/web/worker.test.mjs apps/updater/bundle-meta.test.mjs
          apps/update-server/catalog.test.mjs tools/release/previous-tag.test.mjs

      - name: web 빌드
        working-directory: apps/web
        run: pnpm build

      - name: Playwright 브라우저
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # globalSetup 이 DATABASE_URL 로 마이그레이션을 적용하고, webServer 가 같은 DB 로 뜬다
      - name: e2e
        working-directory: apps/web
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 14

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR 푸시
      id-token: write # cosign keyless 서명
    env:
      # 업데이트 서버가 아직 없으면 이미지만 올리고 등록은 건너뛴다 (step if 는 secrets 를 직접 못 본다)
      UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 이전 태그의 저널을 읽어야 마이그레이션 유무를 판정할 수 있다
          fetch-depth: 0

      - name: 버전 확인
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # package.json 과 태그가 어긋나면 콘솔이 잘못된 버전을 보고한다
          PKG=$(node -p "require('./apps/web/package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::태그 v$VERSION 와 package.json $PKG 가 다릅니다"
            exit 1
          fi
          # 같은 채널에서 현재보다 낮은 태그 중 가장 높은 것. `--sort=-v:refname` 은
          # v1.3.0-beta.1 을 v1.3.0 보다 위로 올려, 정식 릴리스가 베타와만 비교되고
          # 그 사이 마이그레이션이 "없음" 으로 나간다(백업을 건너뛴다).
          PREV=$(node tools/release/previous-tag.mjs "$VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=${PREV#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      # 고객 하드웨어가 무엇일지 모른다. arm64 만 쓰는 곳이 드물지 않다.
      - name: web 이미지 빌드·푸시
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          provenance: true
          sbom: true

      - name: updater 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.UPDATER_IMAGE }}:${{ steps.v.outputs.version }}

      - uses: sigstore/cosign-installer@v3
      - name: 이미지 서명
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      # 태그가 아니라 다이제스트를 배포처에 올린다. 태그는 나중에 다른 이미지를
      # 가리키도록 바뀔 수 있어, 승인한 것과 설치되는 것이 달라질 수 있다.
      - name: 매니페스트 생성
        run: |
          node tools/release/manifest.mjs \
            --version "${{ steps.v.outputs.version }}" \
            --previous "${{ steps.v.outputs.previous }}" \
            --image "$IMAGE" \
            --digest "${{ steps.build.outputs.digest }}" \
            --channel "${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}" \
            --notes "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")" \
            > "manifest.json"
          cat manifest.json

      - name: 배포처에 등록
        if: env.UPDATE_SERVER_URL != ''
        run: |
          curl --fail --silent --show-error \
            -X POST "${UPDATE_SERVER_URL}/v1/releases" \
            -H "authorization: Bearer ${{ secrets.UPDATE_SERVER_TOKEN }}" \
            -H "content-type: application/json" \
            --data @manifest.json

      - name: 배포처 등록 건너뜀
        if: env.UPDATE_SERVER_URL == ''
        run: echo "::notice::UPDATE_SERVER_URL 이 없어 업데이트 서버 등록을 건너뛰었습니다. 이미지는 ${IMAGE}:${{ steps.v.outputs.version }} 에 있습니다."

      # 폐쇄망 고객은 레지스트리에 닿을 수 없다. 반입용 번들을 함께 만들어 둔다.
      # buildx 는 푸시만 하고 로컬 데몬에 이미지를 남기지 않는다 — save 전에 받아 온다.
      # **러너 아키텍처(amd64) 전용 번들이다.** docker save 는 멀티 아키텍처 인덱스를 담지 않는다.
      - name: 폐쇄망 번들
        run: |
          docker pull "${IMAGE}@${{ steps.build.outputs.digest }}"
          docker pull "${UPDATER_IMAGE}:${{ steps.v.outputs.version }}"
          node tools/release/bundle.mjs \
            --version "${{ steps.v.outputs.version }}" \
            --image "${IMAGE}@${{ steps.build.outputs.digest }}" \
            --updater-image "${UPDATER_IMAGE}:${{ steps.v.outputs.version }}" \
            --out "notikit-${{ steps.v.outputs.version }}-airgap.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: airgap-${{ steps.v.outputs.version }}
          # .tar.json 은 콘솔이 번들 목록을 그릴 때 읽는 메타다. 빠지면 반입해도 목록에 나타나지 않는다.
          path: |
            notikit-*-airgap.tar
            notikit-*-airgap.tar.sha256
            notikit-*-airgap.tar.json
            manifest.json
          retention-days: 90
