# 릴리스 — 태그를 밀면 이미지가 만들어지고 서명되고 배포처에 등록된다.
#
# 사람이 손으로 하는 단계를 남기지 않는 것이 목적이다. 특히 `hasMigrations` 는
# 저널 비교로 정한다 — 손으로 적으면 언젠가 틀리고, 틀리는 날은 고객 스키마가
# 백업 없이 바뀌는 날이다.
name: release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ${{ vars.REGISTRY_SERVER }}
  IMAGE: ${{ vars.REGISTRY_SERVER }}/notikit
  UPDATER_IMAGE: ${{ vars.REGISTRY_SERVER }}/notikit-updater

jobs:
  # 깨진 코드가 서명된 이미지로 고객에게 가지 않도록, 배포 전에 전부 돌린다.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notikit
          POSTGRES_PASSWORD: notikit
          POSTGRES_DB: notikit_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notikit -d notikit_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgres://notikit:notikit@localhost:5432/notikit_e2e
      ADMIN_TOKEN: e2e-admin-token
      NOTIKIT_ENCRYPTION_KEY: e2e-encryption-key-32bytes-minimum
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # SDK 는 dist 로 서로를 참조한다(react → web-sdk → core). web e2e 도 core 를 import 한다.
      - name: SDK 빌드
        run: pnpm -r --filter "./packages/*" build

      - name: SDK 테스트
        run: pnpm -r --filter "./packages/*" test

      - name: web 타입 검사
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: web 단위 테스트
        working-directory: apps/web
        run: pnpm exec vitest run

      - name: web 빌드
        working-directory: apps/web
        run: pnpm build

      - name: Playwright 브라우저
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # globalSetup 이 DATABASE_URL 로 마이그레이션을 적용하고, webServer 가 같은 DB 로 뜬다
      - name: e2e
        working-directory: apps/web
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 14

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless 서명
    steps:
      - uses: actions/checkout@v4
        with:
          # 이전 태그의 저널을 읽어야 마이그레이션 유무를 판정할 수 있다
          fetch-depth: 0

      - name: 버전 확인
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # package.json 과 태그가 어긋나면 콘솔이 잘못된 버전을 보고한다
          PKG=$(node -p "require('./apps/web/package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::태그 v$VERSION 와 package.json $PKG 가 다릅니다"
            exit 1
          fi
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=${PREV#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 고객 하드웨어가 무엇일지 모른다. arm64 만 쓰는 곳이 드물지 않다.
      - name: web 이미지 빌드·푸시
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          provenance: true
          sbom: true

      - name: updater 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.UPDATER_IMAGE }}:${{ steps.v.outputs.version }}

      - uses: sigstore/cosign-installer@v3
      - name: 이미지 서명
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      # 태그가 아니라 다이제스트를 배포처에 올린다. 태그는 나중에 다른 이미지를
      # 가리키도록 바뀔 수 있어, 승인한 것과 설치되는 것이 달라질 수 있다.
      - name: 매니페스트 생성
        run: |
          node tools/release/manifest.mjs \
            --version "${{ steps.v.outputs.version }}" \
            --previous "${{ steps.v.outputs.previous }}" \
            --image "$IMAGE" \
            --digest "${{ steps.build.outputs.digest }}" \
            --channel "${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}" \
            --notes "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")" \
            > "manifest.json"
          cat manifest.json

      - name: 배포처에 등록
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.UPDATE_SERVER_URL }}/v1/releases" \
            -H "authorization: Bearer ${{ secrets.UPDATE_SERVER_TOKEN }}" \
            -H "content-type: application/json" \
            --data @manifest.json

      # 폐쇄망 고객은 레지스트리에 닿을 수 없다. 반입용 번들을 함께 만들어 둔다.
      - name: 폐쇄망 번들
        run: |
          node tools/release/bundle.mjs \
            --version "${{ steps.v.outputs.version }}" \
            --image "${IMAGE}@${{ steps.build.outputs.digest }}" \
            --updater-image "${UPDATER_IMAGE}:${{ steps.v.outputs.version }}" \
            --out "notikit-${{ steps.v.outputs.version }}-airgap.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: airgap-${{ steps.v.outputs.version }}
          path: |
            notikit-*-airgap.tar
            notikit-*-airgap.tar.sha256
            manifest.json
          retention-days: 90
