# Notikit — 고객사 인스턴스용. **실제 설치는 이 파일을 쓴다.**
# (개발/로컬 평가는 docker-compose.yml — 소스에서 빌드하고 DB 포트를 루프백에 노출한다.)
#
# 개발용 docker-compose.yml 과 다른 점은 하나다: **소스에서 빌드하지 않는다.**
# 고객사 박스에는 소스가 없고, 있어도 거기서 빌드하면 업데이트에 수 분과 메모리가
# 들며 빌드가 깨지면 설치본이 망가진 채로 남는다. 레지스트리에서 받은 이미지를 쓴다.
#
# 돌고 있는 버전은 `.notikit-image.env` 한 줄에 적혀 있고, 업데이터가 그 줄을 바꾼다.
# compose 파일 본문은 건드리지 않는다 — 고객이 손댄 설정과 충돌하기 때문이다.
#
#   최초 설치:  echo "NOTIKIT_IMAGE=registry.example.com/notikit@sha256:..." > .notikit-image.env
#               docker compose -f docker-compose.prod.yml up -d

services:
  # 스키마 적용. web 은 이게 성공해야 뜬다 — 구버전 코드가 새 스키마를 만나거나
  # 그 반대가 되는 창을 없앤다.
  migrate:
    image: ${NOTIKIT_IMAGE}
    command: ["node", "apps/web/migrate.mjs"]
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    image: ${NOTIKIT_IMAGE}
    env_file: [.env]
    environment:
      # 콘솔에서 업데이트를 누를 수 있게 한다. 끄면 업데이트 경로 자체가 404 가 된다.
      NOTIKIT_SELF_UPDATE: "true"
      BUNDLE_DIR: /bundles
      # 공유 발송 한도. 아래 redis 서비스를 쓰면 이 값, 관리형 Redis 면 .env 로 덮는다.
      # 비우면 인스턴스마다 따로 세므로 web 을 2대 이상 띄울 때 실제 허용치가 배로 늘어난다.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    volumes:
      # 반입된 폐쇄망 번들 목록을 콘솔이 보여 주기 위해서만 필요하다 — 읽기 전용.
      # 설치는 업데이터가 한다.
      - ./bundles:/bundles:ro
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports:
      # 기본은 루프백. 리버스 프록시(TLS 종료) 뒤에 두는 것이 전제다.
      # 프록시 없이 직접 노출하려면 NOTIKIT_BIND=0.0.0.0 으로 바꾼다.
      - "${NOTIKIT_BIND:-127.0.0.1}:${NOTIKIT_PORT:-3000}:3000"
    # liveness(/api/health) 가 아니라 readiness 를 본다 — DB 에 붙고 스키마가 맞아야
    # healthy 다. 업데이터의 교체 성공 판정과 같은 기준이다.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  worker:
    image: ${NOTIKIT_IMAGE}
    command: ["node", "apps/web/worker.mjs"]
    env_file: [.env]
    environment:
      WORKER_BASE_URL: http://web:3000
      # 아래는 모두 worker.mjs 의 기본값과 같은 안전한 값이다. .env 로 덮을 수 있게 노출만 해 둔다.
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-10000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_REQUEST_TIMEOUT_MS: ${WORKER_REQUEST_TIMEOUT_MS:-120000}
      WORKER_WEBHOOK_SWEEP_MS: ${WORKER_WEBHOOK_SWEEP_MS:-60000}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      # ADMIN_TOKEN 은 .env 에서. 내부 sweep 라우트(/api/internal/webhooks/sweep)도 같은 값을 쓴다.
    depends_on:
      # started 가 아니라 healthy — web 이 DB 에 붙기 전에 폴링을 시작하면
      # 기동 로그가 실패 경고로 덮인다.
      web: { condition: service_healthy }
    # SIGTERM 뒤 진행 중 tick 을 WORKER_SHUTDOWN_TIMEOUT_MS 까지 기다린다.
    # compose 기본 유예 10초로는 그 대기가 SIGKILL 로 잘려 발송 결과 기록이 유실된다.
    stop_grace_period: 45s
    restart: unless-stopped

  # 업데이터 — Docker 소켓을 쥐는 유일한 컨테이너.
  # 포트를 열지 않는다. 콘솔과는 DB 의 update_jobs 테이블로만 이야기한다.
  updater:
    image: ${NOTIKIT_UPDATER_IMAGE:-${NOTIKIT_IMAGE}}
    env_file: [.env]
    environment:
      COMPOSE_FILE: /project/docker-compose.prod.yml
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-notikit}
      IMAGE_ENV_FILE: /project/.notikit-image.env
      BACKUP_DIR: /backups
      BUNDLE_DIR: /bundles
    volumes:
      # 소켓 — 컨테이너를 교체할 권한. 이 한 줄이 이 컨테이너를 특권으로 만든다.
      - /var/run/docker.sock:/var/run/docker.sock
      # compose 파일과 이미지 참조 파일이 있는 디렉터리. 쓰기가 필요하다(참조 갱신).
      - ./:/project
      # 마이그레이션 전 덤프. 되돌릴 길이 여기밖에 없으므로 호스트에 남긴다.
      - ./backups:/backups
      # 폐쇄망 반입 번들. 운영자가 여기에 파일을 두면 콘솔 목록에 나타난다.
      - ./bundles:/bundles:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notikit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-notikit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notikit}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 개발용과 달리 포트를 밖으로 내지 않는다 — DB 를 인터넷에 열지 않는다
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    # 포트를 밖으로 내지 않는다 — 무인증 Redis 를 인터넷에 열지 않는다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
